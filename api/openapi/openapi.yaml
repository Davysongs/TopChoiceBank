openapi: 3.0.3
info:
  title: TopChoiceBank v2
  version: 0.1.0
  description: Foundation API for TopChoiceBank v2
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /v1/auth/register:
    post:
      summary: Register a new user credential and profile shell
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User credential created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Malformed JSON or invalid syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Password or email policy validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/login:
    post:
      summary: Authenticate credentials and start a rotating refresh-token family
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed JSON or invalid syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Account locked or disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - accepted_terms_version
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: SecureP@ssw0rd!2026
        accepted_terms_version:
          type: string
          example: v2026.1

    RegisterResponse:
      type: object
      required:
        - user_id
        - status
        - email_verification_required
      properties:
        user_id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          example: PENDING
        email_verification_required:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - email
        - password
        - device_fingerprint
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: SecureP@ssw0rd!2026
        device_fingerprint:
          type: string
          example: fp_abc123xyz
        totp_code:
          type: string
          example: "123456"

    LoginResponse:
      type: object
      required:
        - access_token
        - expires_in
        - refresh_token
        - session_id
        - mfa_required
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          example: 900
        refresh_token:
          type: string
          example: a1b2c3d4e5f6...
        session_id:
          type: string
          format: uuid
          example: 987e6543-e21b-12d3-a456-426614174000
        mfa_required:
          type: boolean
          example: false

    ProblemDetails:
      type: object
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Validation Error
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: password must be at least 8 characters long
        instance:
          type: string
          example: /v1/auth/register
